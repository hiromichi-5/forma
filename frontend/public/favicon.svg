<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="forma ticket favicon">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Round background -->
  <circle cx="32" cy="32" r="28" fill="url(#g)"/>

  <!-- Form sheet -->
  <rect x="18.5" y="17.5" width="23" height="28" rx="3" fill="#FFFFFF" opacity="0.98"/>
  <rect x="18.5" y="17.5" width="23" height="6" rx="2" fill="#E0E7FF"/>

  <!-- Form lines -->
  <rect x="22.5" y="28" width="15" height="2.6" rx="1.2" fill="#A5B4FC"/>
  <rect x="22.5" y="34" width="15" height="2.6" rx="1.2" fill="#A5B4FC"/>
  <rect x="22.5" y="40" width="13" height="2.6" rx="1.2" fill="#A5B4FC"/>


  <!-- Ticket badge (perforation + notches) -->
  <g transform="translate(36,36)">
