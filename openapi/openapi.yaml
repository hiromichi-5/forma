openapi: 3.0.3
info:
  title: Forma API
  description: API documentation for the Forma API
  version: 0.0.2
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
    RegisterFormRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Google Forms のURLまたはフォームID" }
        polling_sec: { type: integer, default: 30 }
    RegisterFormResponse:
      type: object
      required: [form_id]
      properties:
        form_id: { type: string }
    FormSummary:
      type: object
      required: [form_id, title]
      properties:
        form_id: { type: string }
        title: { type: string }
        connected_at: { type: string, format: date-time, nullable: true }
        sync_cursor: { type: string, format: date-time, nullable: true }
    ListFormsResponse:
      type: object
      required: [forms]
      properties:
        forms:
          type: array
          items: { $ref: "#/components/schemas/FormSummary" }
    HealthResponse:
      type: object
      required: [form_id, title]
      properties:
        form_id: { type: string }
        title: { type: string }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, nullable: true }
    Member:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor] }
    ListMembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor] }
    ChangeMemberRoleRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [admin, editor] }
    SyncResponse:
      type: object
      required: [synced, newTickets]
      properties:
        synced: { type: integer, description: "同期された回答数" }
        newTickets: { type: integer, description: "新規作成されたチケット数" }
        last:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "最後に同期された回答の送信時刻",
          }
    Response:
      type: object
      required:
        [
          response_id,
          form_id,
          submitted_at,
          payload,
          schema_version,
          created_at,
        ]
      properties:
        response_id: { type: string }
        form_id: { type: string }
        submitted_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
        schema_version: { type: integer }
        created_at: { type: string, format: date-time }
    ListResponsesResponse:
      type: object
      required: [responses]
      properties:
        responses:
          type: array
          items: { $ref: "#/components/schemas/Response" }
    Ticket:
      type: object
      required:
        [id, form_id, response_id, status, priority, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string }
        response_id: { type: string }
        status: { type: string, enum: [new, in_progress, done] }
        assignee_id: { type: string, format: uuid, nullable: true }
        priority: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListTicketsResponse:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
    UpdateTicketRequest:
      type: object
      properties:
        status: { type: string, enum: [new, in_progress, done] }
        assignee_id: { type: string, format: uuid, nullable: true }

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /v1/auth/login:
    post:
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }

  /v1/whoami:
    get:
      summary: user_idの取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id: { type: string }

  /v1/forms:
    get:
      summary: フォーム一覧
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListFormsResponse" }
        "401":
          description: Unauthorized
    post:
      summary: フォーム登録（admin専用）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterFormRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterFormResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (insufficient role)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Forms not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/health:
    get:
      summary: 接続検証（admin/editor）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden or Forms not shared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Forms not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/members:
    get:
      summary: メンバー一覧取得（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListMembersResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      summary: メンバー追加（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    patch:
      summary: メンバーロール変更（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" }
      responses:
        "200":
          description: OK
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      summary: メンバー削除（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error (missing user_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/sync:
    post:
      summary: フォーム回答の手動同期（admin/editor）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 同期完了
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin/editor role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/responses:
    get:
      summary: 回答一覧取得（admin/editor）
      parameters:
        - in: query
          name: form_id
          schema: { type: string }
          description: "フィルタリング用のフォームID"
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: "指定時刻以降の回答を取得（RFC3339形式）"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponsesResponse" }
        "400":
          description: Validation error (invalid since format)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tickets:
    get:
      summary: チケット一覧取得（admin/editor）
      parameters:
        - in: query
          name: form_id
          schema: { type: string }
          description: "フィルタリング用のフォームID"
        - in: query
          name: status
          schema: { type: string, enum: [new, in_progress, done] }
          description: "フィルタリング用のステータス"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListTicketsResponse" }
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tickets/{ticket_id}:
    get:
      summary: チケット詳細取得（admin/editor）
      parameters:
        - in: path
          name: ticket_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400":
          description: Validation error (invalid ticket_id format)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "404":
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    patch:
      summary: チケット更新（admin/editor）
      parameters:
        - in: path
          name: ticket_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTicketRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
