openapi: 3.0.3
info:
  title: Forma API
  description: API documentation for the Forma API
  version: 0.0.2
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
    RegisterFormRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Google Forms のURLまたはフォームID" }
        polling_sec: { type: integer, default: 30 }
    RegisterFormResponse:
      type: object
      required: [form_id]
      properties:
        form_id: { type: string }
    FormSummary:
      type: object
      required: [form_id, title]
      properties:
        form_id: { type: string }
        title: { type: string }
        connected_at: { type: string, format: date-time, nullable: true }
        sync_cursor: { type: string, format: date-time, nullable: true }
    ListFormsResponse:
      type: object
      required: [forms]
      properties:
        forms:
          type: array
          items: { $ref: "#/components/schemas/FormSummary" }
    HealthResponse:
      type: object
      required: [form_id, title]
      properties:
        form_id: { type: string }
        title: { type: string }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, nullable: true }
    Member:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor] }
    ListMembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor] }
    ChangeMemberRoleRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [admin, editor] }

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /v1/auth/login:
    post:
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }

  /v1/whoami:
    get:
      summary: user_idの取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id: { type: string }

  /v1/forms:
    get:
      summary: フォーム一覧
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListFormsResponse" }
        "401":
          description: Unauthorized
    post:
      summary: フォーム登録（admin専用）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterFormRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterFormResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (insufficient role)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Forms not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/health:
    get:
      summary: 接続検証（admin/editor）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden or Forms not shared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Forms not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/members:
    get:
      summary: メンバー一覧取得（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListMembersResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      summary: メンバー追加（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    patch:
      summary: メンバーロール変更（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" }
      responses:
        "200":
          description: OK
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      summary: メンバー削除（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error (missing user_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
