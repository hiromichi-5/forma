version: "2"
sql:
  - schema: "backend/migrations"
    queries: "backend/internal/db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "backend/internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        overrides:
          - db_type: "ticket_status"
            go_type: "string"
