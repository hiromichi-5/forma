version: "3.9"
services:
  api:
    build: .
    command: ./bin/api
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [db]
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
volumes:
  dbdata: {}
