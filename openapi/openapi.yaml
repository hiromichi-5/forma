openapi: 3.0.3
info:
  title: Forma API
  description: API documentation for the Forma API
  version: 0.0.2
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
    SignupRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
    SignupResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
    RegisterFormRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Google Forms のURLまたはフォームID" }
        polling_sec: { type: integer, default: 30 }
    RegisterFormResponse:
      type: object
      required: [form_id]
      properties:
        form_id: { type: string }
    FormSummary:
      type: object
      required: [form_id, title]
      properties:
        form_id: { type: string }
        title: { type: string }
    ListFormsResponse:
      type: object
      required: [forms]
      properties:
        forms:
          type: array
          items: { $ref: "#/components/schemas/FormSummary" }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, nullable: true }
    Member:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor] }
    ListMembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor] }
    ChangeMemberRoleRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, editor] }
    FormInvite:
      type: object
      required: [code, form_id, role, expires_at, created_by, created_at, revoked]
      properties:
        code: { type: string }
        form_id: { type: string }
        role: { type: string, enum: [editor] }
        expires_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        revoked: { type: boolean }
    ListFormInvitesResponse:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: "#/components/schemas/FormInvite" }
    SyncResponse:
      type: object
      required: [synced, newTickets]
      properties:
        synced: { type: integer, description: "同期された回答数" }
        newTickets: { type: integer, description: "新規作成されたチケット数" }
        last:
          {
            type: string,
            description: "最後に同期された回答の送信時刻（RFC3339形式）または空文字列",
          }
    Response:
      type: object
      required:
        [
          response_id,
          form_id,
          submitted_at,
          payload,
          schema_version,
          created_at,
        ]
      properties:
        response_id: { type: string }
        form_id: { type: string }
        submitted_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
        schema_version: { type: integer }
        created_at: { type: string, format: date-time }
    ListResponsesResponse:
      type: object
      required: [responses]
      properties:
        responses:
          type: array
          items: { $ref: "#/components/schemas/Response" }
    TicketAssignee:
      type: object
      required: [id, display_name, email]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
    TicketSummary:
      type: object
      required:
        [id, form_id, form_title, response_id, status, priority, title, submitted_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string }
        form_title: { type: string }
        response_id: { type: string }
        status: { type: string, enum: [new, in_progress, done] }
        priority: { type: integer, minimum: 1, maximum: 5 }
        title_question_id: { type: string, nullable: true }
        title: { type: string }
        assignee:
          allOf:
            - $ref: "#/components/schemas/TicketAssignee"
          nullable: true
        submitted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketAnswer:
      type: object
      required: [question_id, question_title, question_type, values, display_value]
      properties:
        question_id: { type: string }
        question_title: { type: string }
        question_type: { type: string }
        values:
          type: array
          items: { type: string }
        display_value: { type: string }
    FormQuestion:
      type: object
      required: [form_id, question_id, title, question_type]
      properties:
        form_id: { type: string }
        question_id: { type: string }
        title: { type: string }
        question_type: { type: string }
        options:
          type: array
          items: { type: string }
          nullable: true
    ListFormQuestionsResponse:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/FormQuestion" }
    UpdateFormTitleQuestionRequest:
      type: object
      properties:
        title_question_id: { type: string, nullable: true }
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/TicketSummary"
        - type: object
          required: [answers]
          properties:
            answers:
              type: array
              items: { $ref: "#/components/schemas/TicketAnswer" }
    ListTicketsResponse:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/TicketSummary" }
    UpdateTicketRequest:
      type: object
      properties:
        status: { type: string, enum: [new, in_progress, done] }
        assignee_id: { type: string, format: uuid, nullable: true }
        priority: { type: integer, minimum: 1, maximum: 5 }
    UserProfile:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
    UpdateUserProfileRequest:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: ヘルスチェック
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "ok"

  /v1/auth/login:
    post:
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/signup:
    post:
      summary: サインアップ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/whoami:
    get:
      summary: user_idの取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id: { type: string }

  /v1/me:
    get:
      summary: プロフィール取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      summary: プロフィール更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserProfileRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: アカウント削除
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms:
    get:
      summary: フォーム一覧
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListFormsResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: フォーム登録
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterFormRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterFormResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Forms not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/health:
    get:
      summary: 接続検証
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [form_id, title]
                properties:
                  form_id: { type: string }
                  title: { type: string }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Forms not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/members:
    get:
      summary: メンバー一覧取得（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListMembersResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      summary: メンバー追加（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    patch:
      summary: メンバーロール変更（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" }
      responses:
        "200":
          description: OK
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      summary: メンバー削除（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error (missing user_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/invites:
    get:
      summary: 招待コード一覧取得（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListFormInvitesResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      summary: 招待コード発行（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/invites/{code}:
    delete:
      summary: 招待コード失効（admin専用）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Invite not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/invites/accept:
    post:
      summary: 招待コード受理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Invite not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Invite expired or revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/questions:
    get:
      summary: フォームの質問一覧取得（admin/editor）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListFormQuestionsResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin/editor role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/title-question:
    patch:
      summary: タイトル用質問の更新（admin）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFormTitleQuestionRequest" }
      responses:
        "204":
          description: Updated
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/forms/{form_id}/sync:
    post:
      summary: フォーム回答の手動同期（admin/editor）
      parameters:
        - in: path
          name: form_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 同期完了
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin/editor role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/responses:
    get:
      summary: 回答一覧取得（admin/editor）
      parameters:
        - in: query
          name: form_id
          schema: { type: string }
          description: "フィルタリング用のフォームID"
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: "指定時刻以降の回答を取得（RFC3339形式）"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponsesResponse" }
        "400":
          description: Validation error (invalid since format)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin/editor role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tickets:
    get:
      summary: チケット一覧取得（admin/editor）
      parameters:
        - in: query
          name: form_id
          schema: { type: string }
          description: "フィルタリング用のフォームID"
        - in: query
          name: status
          schema: { type: string, enum: [new, in_progress, done] }
          description: "フィルタリング用のステータス"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListTicketsResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin/editor role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tickets/{ticket_id}:
    get:
      summary: チケット詳細取得（admin/editor）
      parameters:
        - in: path
          name: ticket_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "400":
          description: Validation error (invalid ticket_id format)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin/editor role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    patch:
      summary: チケット更新（admin/editor）
      parameters:
        - in: path
          name: ticket_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTicketRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden (admin/editor role required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
