    <path d="M2 3c1.6 0 2.9 1.3 2.9 2.9S3.6 8.8 2 8.8V11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8.8c-1.6 0-2.9-1.3-2.9-2.9S16.4 3 18 3V1c0-1.1-.9-2-2-2H4C2.9-1 2 0 2 1v2Z" fill="#F59E0B"/>
    <!-- perforation line -->
    <rect x="9.6" y="0" width="1.8" height="12" fill="#FFFFFF" opacity=".75"/>
    <!-- perforation dots -->
    <circle cx="10.5" cy="2.2" r="0.55" fill="#FFFFFF"/>
    <circle cx="10.5" cy="4.6" r="0.55" fill="#FFFFFF"/>
    <circle cx="10.5" cy="7.0" r="0.55" fill="#FFFFFF"/>
    <circle cx="10.5" cy="9.4" r="0.55" fill="#FFFFFF"/>
